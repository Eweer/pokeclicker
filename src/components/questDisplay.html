<div id="questDisplayContainer" class="card sortable border-secondary mb-3">
    <!-- ko if: App.game.quests.isDailyQuestsUnlocked() -->
        <div class="card-header p-0" data-toggle="collapse" href="#dailyQuestDisplayBody">
            <span data-bind='text: "Daily Quests (" + App.game.quests.completedQuests().length + "/" + GameConstants.QUESTS_PER_SET + ")"'></span>
        </div>
        <button class="btn btn-sm btn-primary" style="position: absolute; right: 0px; top: 0px; width: auto; height: 41px;"
                data-bind="click: function(){$('#QuestModal').modal('show')}">
            List
        </button>
    <!-- /ko -->
    <div id="dailyQuestDisplayBody" class="card-body p-0 show questDisplayBlock">
        <!-- ko if: App.game.quests.currentQuests().length == 0 && App.game.quests.isDailyQuestsUnlocked() -->
            <span class="pt-2 pb-2">Click "List" to start a new quest.</span>
        <!-- /ko -->
        <table width="100%" class="table table-sm">
            <!-- List of player quests -->
            <tbody data-bind="foreach: App.game.quests.currentQuests()">
                <tr class="text-center">
                    <td class="m-0" style="width: 75%;" data-bind="text: $data.description"></td>
                    <td style="vertical-align: middle;">
                        <div style="min-width: 112px; display: flex; align-items: center;">
                            <div class="progress p-0" style="flex: 1; margin-bottom: 0; border-radius: 5px 0px 0px 5px;">
                                <div class="progress-bar bg-primary" role="progressbar"
                                    style="border-radius: 25px 0px 0px 25px;"
                                    data-bind="attr:{ style: 'width:' + ($data.progress() * 100) + '%'}"
                                    aria-valuemin="0" aria-valuemax="100">
                                    <span data-bind="text: $data.progressText">0 / 1000</span>
                                </div>
                            </div>
                            <!-- ko ifnot: $data.isCompleted() -->
                            <button class="btn btn-danger btn-sm btn-block p-0"
                                    style="width: 24px; flex-shrink: 0; border-radius: 0px 5px 5px 0px;"
                                    data-bind="click: () => { App.game.quests.quitQuest($data.index, $data.progress() > 0) }">
                                X
                            </button>
                            <!-- /ko -->
                            <!-- ko if: $data.isCompleted() -->
                            <button class="btn btn-success btn-sm btn-block p-0"
                                    style="width: 24px; flex-shrink: 0; border-radius: 0px 5px 5px 0px;"
                                    data-bind="click: () => { App.game.quests.claimQuest($data.index) }">
                                ✓
                            </button>
                            <!-- /ko -->
                        </div>
                    </td>
                </tr>
            </tbody>
            <!-- ko if: App.game.quests.currentQuests().length < App.game.quests.questSlots() -->
                <tbody>
                    <tr class="text-center">
                        <td colspan="2">
                            <button class="btn btn-sm btn-info"
                                    style="height: 24px"
                                    data-bind="click: function(){$('#QuestModal').modal('show')}"
                            >
                                Add new quest
                            </button>
                        </td>
                    </tr>
                </tbody>
            <!-- /ko -->
		</table>
	</div>
</div>

<div id="questLineDisplayContainer" class="card sortable border-secondary mb-3">
    <!-- List of quest line quests -->
	<!-- ko let: { activeQuestLines: App.game.quests.questLines().filter((ql) => ql.state() == QuestLineState.started) } -->
        <!-- ko if: activeQuestLines.length -->
        <div class="card-header p-0" data-toggle="collapse" href="#questLineDisplayBody">
            <span>Quest Lines</span>
        </div>
        <!-- /ko -->
        <div id="questLineDisplayBody" class="card-body p-0 show" data-bind="foreach: activeQuestLines">
    		<div class="questDisplayBlock questLine">
    			<div class="card-body p-0 show">
    				<table class="table table-sm m-0" style="width: 100%">
                        <thead>
                            <tr style="cursor: pointer;" data-toggle="collapse" data-bind="attr : {href : '#qlcard_' + $index()}">
                                <!-- ko if: $index() == 0 -->
                                <th colspan="2"
                                    data-bind="
                                        text: $data.displayName,
                                        tooltip: { title: $data.curQuestObject().description, trigger: 'hover', placement:'left' }
                                    ">
                                </th>
                                <!-- /ko -->
                                <!-- ko ifnot: $index() == 0 -->
                                <th colspan="2"
                                    style="border-top: 1px solid black"
                                    data-bind="
                                        text: $data.displayName,
                                        tooltip: { title: $data.curQuestObject().description, trigger: 'hover', placement:'left' }
                                    ">
                                </th>
                                <!-- /ko -->
                            </tr>
                        </thead>
    					<tbody class="collapse show" data-bind="attr : {id : 'qlcard_' + $index()}">
    						<!-- ko ifnot: $data.curQuestObject().quests -->
    						<tr class="text-center">
    							<td class="font-italic" style="width: 75%; vertical-align: middle;" data-bind="text: $data.curQuestObject().description"></td>
    							<td style="vertical-align: middle;">
    								<div class="progress p-0">
    									<div class="progress-bar bg-success" role="progressbar"
    										data-bind="attr:{ style: 'width:' + ($data.curQuestObject().progress() * 100) + '%'}"
    										aria-valuemin="0" aria-valuemax="100">
    										<span data-bind="text: ko.pureComputed(function(){return $data.curQuestObject().progressText()})">0/1000</span>
    									</div>
    								</div>
    							</td>
    						</tr>
    						<!-- /ko -->
    						<!-- ko if: $data.curQuestObject().quests -->
    							<!-- ko foreach: $data.curQuestObject().quests -->
    								<!-- ko if: $data.description-->
                                    <tr class="text-center">
                                        <td class="font-italic" style="width: 75%; vertical-align: middle;" data-bind="text: $data.description"></td>
                                        <td style="vertical-align: middle;">
                                            <div class="progress p-0">
                                                <div class="progress-bar bg-success" role="progressbar"
                                                    data-bind="attr:{ style: 'width:' + ($data.progress() * 100) + '%'}"
                                                    aria-valuemin="0" aria-valuemax="100">
                                                    <span data-bind="text: ko.pureComputed(function(){return $data.progressText()})">0/1000</span>
                                                </div>
                                            </div>
                                        </td>
    								</tr>
    								<!-- /ko -->
    								<!-- ko ifnot: $data.description-->
                                    <tr class="text-center">
                                        <td colspan="2">
                                            <div class="progress p-0">
                                                <div class="progress-bar bg-success" role="progressbar"
                                                    data-bind="attr:{ style: 'width:' + ($data.progress() * 100) + '%'}"
                                                    aria-valuemin="0" aria-valuemax="100">
                                                    <span data-bind="text: ko.pureComputed(function(){return $data.progressText()})">0/1000</span>
                                                </div>
                                            </div>
                                        </td>
    								</tr>
    								<!-- /ko -->
    							<!-- /ko -->
    						<!-- /ko -->
    					</tbody>
    				</table>
    			</div>
    		</div>
        </div>
	<!-- /ko -->
</div>
